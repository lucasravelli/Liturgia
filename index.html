<style>
:root{--bg:#faf1ea;--card:#fff;--ink:#2a1f1a;--soft:#7a6c63;--line:#ecd9cc;--accent:#b3552f;--brand:#b3552f;--fs:19px;--serif:Georgia,"Noto Serif",serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--sh:0 1px 2px rgba(60,30,15,.06),0 8px 24px rgba(60,30,15,.08)}
[data-cor=azul]{--accent:#2f4b8f;--brand:#2f4b8f;--bg:#eef2fa;--line:#d5dff0}
[data-cor=rosa]{--accent:#b3557a;--brand:#b3557a;--bg:#fbeff4;--line:#efd5e0}
[data-cor=verde]{--accent:#3d7a4a;--brand:#3d7a4a;--bg:#edf5ee;--line:#d3e4d6}
[data-cor=terra]{--accent:#b3552f;--brand:#b3552f;--bg:#faf1ea;--line:#ecd9cc}
[data-dark]{--bg:#1a120e;--card:#241913;--ink:#f2ebe6;--soft:#a39a95;--line:#3a2a20;--accent:#e8906a;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3)}
[data-dark][data-cor=azul]{--bg:#0d1220;--card:#151c2e;--line:#25304a;--accent:#7f9cf0;--soft:#9aa3b5}
[data-dark][data-cor=rosa]{--bg:#1c0f15;--card:#271720;--line:#40262f;--accent:#e58aae}
[data-dark][data-cor=verde]{--bg:#0d1710;--card:#15231a;--line:#24392a;--accent:#7cc48a}
[data-dark][data-cor=terra]{--bg:#1a120e;--card:#241913;--line:#3a2a20;--accent:#e8906a}
[data-dark] .btn,[data-dark] .pill,[data-dark] .chip[aria-pressed=true]{color:#1a120e}
/* aba Liturgia na cor litúrgica do dia */
#leit[data-lit]{--brand:var(--lit);--accent:var(--lit)}
[data-dark] #leit[data-lit]{--accent:var(--lit-d)}
[data-dark] .hero{border:1px solid rgba(255,255,255,.14)}
.setc{margin-bottom:14px}
.setc h3{margin:0 0 12px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.sws{display:flex;gap:8px;margin-top:14px}
.swb{flex:1;border:2px solid transparent;border-radius:16px;padding:10px 4px;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer}
.swb i{width:28px;height:28px;border-radius:50%}
.swb[aria-pressed=true]{border-color:var(--accent)}
.setrow{display:flex;align-items:center;gap:10px;margin-top:12px}
.setrow span{flex:1;font-size:15px;font-weight:600}
.setrow .seg{margin:0;flex:1}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent);width:auto;flex:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.45}
button{font-family:inherit}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px}
.bar-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:4px}
.bar h1{flex:1;margin:0;text-align:center;font-size:16px;font-weight:700;color:var(--accent)}
.ib{width:40px;height:40px;border:0;background:none;border-radius:50%;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ib:active{background:var(--line)}
.pill{border:0;background:var(--accent);color:#fff;font-weight:700;font-size:13px;padding:8px 14px;border-radius:20px;cursor:pointer;box-shadow:var(--sh)}
main{max-width:680px;margin:0 auto;padding:8px 16px calc(110px + env(safe-area-inset-bottom,0px))}
.hero{position:relative;overflow:hidden;color:#fff;border-radius:24px;padding:22px 22px 24px;margin-bottom:16px;background:linear-gradient(140deg,var(--brand),color-mix(in srgb,var(--brand) 55%,#000));box-shadow:var(--sh)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero .d{font-size:13px;opacity:.85;text-transform:capitalize;position:relative}
.hero .t{margin-top:6px;font-size:25px;font-weight:700;line-height:1.2;letter-spacing:-.02em;position:relative}
.hero .c{margin-top:16px;display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:700;letter-spacing:.01em;background:rgba(255,255,255,.22);padding:10px 18px 10px 12px;border-radius:26px;position:relative}
.hero .c i{width:24px;height:24px;flex-shrink:0;border-radius:50%;border:4px solid #fff;background:var(--lit,#fff);box-shadow:0 0 0 2px rgba(0,0,0,.12)}
.hero .c small{display:block;font-size:11px;font-weight:600;opacity:.85;text-transform:uppercase;letter-spacing:.08em;line-height:1.1}
.hero .c b{display:block;font-size:17px;line-height:1.15}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:0;background:var(--card);color:var(--soft);font-weight:600;font-size:14px;padding:10px 16px;border-radius:22px;cursor:pointer;box-shadow:var(--sh)}
.chip[aria-pressed=true]{background:var(--accent);color:#fff}
.card{background:var(--card);border-radius:22px;padding:22px;box-shadow:var(--sh);border-top:4px solid var(--accent)}
.card .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card .top b{flex:1;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.fs{border:0;background:var(--bg);color:var(--ink);border-radius:10px;font-weight:700;padding:6px 11px;cursor:pointer;font-size:13px}
.ref{font-size:17px;font-weight:700;margin:0 0 16px}
.rf{font-family:var(--serif);font-style:italic;font-size:var(--fs);margin:0 0 14px;color:var(--accent)}
.txt{font-family:var(--serif);font-size:var(--fs);line-height:1.75;white-space:pre-line}
.note{background:var(--card);border-radius:16px;padding:14px 16px;color:var(--soft);font-size:14px;margin-bottom:14px;box-shadow:var(--sh)}
.note b{color:var(--ink)}
.sec{margin:6px 0 4px;font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--accent)}
.sub{margin:0 0 18px;color:var(--soft);font-size:14px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{min-height:100px;resize:vertical;margin-top:8px;font-family:var(--serif)}
.form{margin-bottom:22px}
.fr{display:flex;align-items:center;gap:10px;margin-top:10px}
.btn{font-weight:700;font-size:15px;padding:12px 24px;border-radius:14px;border:0;background:var(--accent);color:#fff;cursor:pointer}
.btn:disabled{opacity:.6}
.st{flex:1;color:var(--soft);font-size:13px}
.cm{display:flex;gap:12px;background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--sh);border-left:4px solid var(--accent)}
.av{width:40px;height:40px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cm .w{font-weight:700;font-size:14px}.cm .w span{margin-left:6px;font-weight:400;font-size:12px;color:var(--soft)}
.cm p{margin:3px 0 0;font-family:var(--serif);font-size:17px;white-space:pre-line;word-break:break-word}
.empty{text-align:center;color:var(--soft);padding:26px 0}
.src{margin-top:18px;text-align:center;font-size:12px;color:var(--soft)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:600;font-size:14px;color:var(--soft);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);color:var(--accent);box-shadow:var(--sh)}
.auth{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--sh);margin-bottom:22px}
.auth input{margin-bottom:8px}
.who{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:14px;color:var(--soft)}
.who b{color:var(--ink)}.who button{margin-left:auto;border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer}
.rk{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh)}
.rk.me{outline:2px solid var(--accent)}
.pos{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--soft);background:var(--bg)}
.top1 .pos{background:#e6b422;color:#fff}.top2 .pos{background:#9ea7b5;color:#fff}.top3 .pos{background:#c07a43;color:#fff}
.rk .n{flex:1;font-weight:700}
.rk .s{text-align:right;font-size:12px;color:var(--soft)}.rk .s b{display:block;font-size:18px;color:var(--ink)}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;width:calc(100% - 28px);max-width:440px;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:28px;padding:6px;box-shadow:0 10px 30px rgba(60,30,15,.18)}
.tabbar div{display:flex}
.tabbar button{flex:1;border:0;background:none;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;padding:8px 4px;border-radius:22px;cursor:pointer}
.tabbar button[aria-selected=true]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.gate{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;display:flex;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
.gate-in{margin:auto;width:100%;max-width:380px}
.gate-hero{color:#fff;border-radius:26px;padding:28px 24px;margin-bottom:18px;text-align:center;background:linear-gradient(140deg,var(--brand),color-mix(in srgb,var(--brand) 50%,#000));box-shadow:var(--sh)}
.gate-hero svg{display:block;margin:0 auto 12px}
.logo{display:block;border-radius:22%;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.gate-hero .logo{width:84px;height:84px;margin:0 auto 14px}
.bar h1{display:flex;align-items:center;justify-content:center;gap:8px}
.bar .logo{width:26px;height:26px;box-shadow:none}
[data-dark] .logo:not(.app){box-shadow:none;border-radius:0}
.vis{margin:8px 0 0}.vis.seg{margin:8px 0 0}
.tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.code{font-size:30px;font-weight:800;letter-spacing:.25em;text-align:center;color:var(--accent);padding:10px 0}
.cpl p{margin:0 0 10px;font-size:14px;color:var(--soft)}
.cpl .row{display:flex;gap:8px}.cpl .row input{flex:1;text-transform:uppercase}
.cpl .btn{padding:12px 18px}.cpl .btn.alt{background:var(--bg);color:var(--accent);border:1.5px solid var(--line)}
.gate-hero h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.gate-hero p{margin:6px 0 0;font-size:14px;opacity:.85}
.gate-form{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--sh)}
.gate-form input{margin-bottom:8px}
.gate-form .btn{width:100%}
.calbtn{margin:14px 0 0 8px;display:inline-flex;align-items:center;gap:7px;border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:700;color:#fff;background:rgba(255,255,255,.22);padding:10px 14px;border-radius:26px;position:relative}
.modal{position:fixed;inset:0;z-index:40;background:rgba(20,10,5,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px))}
.sh-h{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.sh-h h3{flex:1;margin:0;text-align:center;font-size:18px;text-transform:capitalize;color:var(--accent)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cg .w{text-align:center;font-size:11px;font-weight:700;color:var(--soft);padding:4px 0}
.cd{border:0;background:var(--card);border-radius:12px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.cd i{width:18px;height:8px;border-radius:5px}
.cd.td{outline:2px solid var(--soft)}.cd.sel{outline:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.lg{margin-top:16px;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--sh)}
.lg div{display:flex;align-items:flex-start;gap:10px;font-size:13px;padding:5px 0}.lg div i{width:22px;height:22px;border-radius:50%;flex-shrink:0}.lg b{display:block}.lg span{color:var(--soft)}
.cnote{margin-top:10px;font-size:12px;color:var(--soft)}
.splash{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;pointer-events:none}
.splash.go{animation:spl 1.7s ease forwards}
.splash .logo{width:132px;height:132px;animation:pop .7s ease both}
.splash h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--accent)}
@keyframes spl{0%,65%{opacity:1}100%{opacity:0}}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
[hidden]{display:none!important}

<script>
/* liturgiaUrl: API de liturgia ({d} {m} {y} viram dia, mês e ano).
   supabase: preencha url e anonKey para ativar os comentários compartilhados (veja supabase.sql). */
const CONFIG={
  liturgiaUrl:"https://liturgia.up.railway.app/v2/?dia={d}&mes={m}&ano={y}",
  liturgiaUrlAlt:"https://liturgia.up.railway.app/v2/{d}-{m}", /* alternativa (só ano atual) */
  supabase:{url:"https://bpdvkfbkywmraudvqddk.supabase.co",anonKey:"sb_publishable_b3XwVxJwlTDQ-z4i8k8ckQ_A9rEntbJ"}
};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
/* cor litúrgica: [cor no tema claro, cor no tema escuro] */
const LIT={verde:["#3d7a4a","#7cc48a"],branco:["#9a8450","#d9c27a"],vermelho:["#b3402f","#ee8a78"],roxo:["#6d4c8a","#b79ad6"],rosa:["#c25f84","#ee9ab9"],preto:["#3a3a3a","#c9c9c9"]};
const NOMES={verde:"Verde",branco:"Branco",vermelho:"Vermelho",roxo:"Roxo",rosa:"Rosa",preto:"Preto"};
const colorKey=s=>{s=String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");return Object.keys(LIT).find(k=>s.includes(k))||""};
/* calendário litúrgico local: usado só quando a fonte não informa a cor */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),t=h+l-7*m+114;return new Date(y,Math.floor(t/31)-1,t%31+1,12)}
function seasonOf(d){
  const y=d.getFullYear(),day=x=>Math.round(x/864e5),n=day(d)-day(easter(y));
  const w=new Date(y,11,25,12).getDay()||7,adv=new Date(y,11,25-w-21,12),dn=day(d)-day(adv);
  if(dn>=0&&d.getMonth()==11&&d.getDate()<25)return{k:dn==14?"rosa":"roxo",t:"Advento"};
  if(d.getMonth()==11&&d.getDate()>=25)return{k:"branco",t:"Tempo do Natal"};
  let e=new Date(y,0,2,12);while(e.getDay())e.setDate(e.getDate()+1);
  if(day(d)<=day(e)+7)return{k:"branco",t:"Tempo do Natal"};
  if(n==-7)return{k:"vermelho",t:"Domingo de Ramos"};
  if(n>=-46&&n<=-4)return{k:n==-21?"rosa":"roxo",t:"Quaresma"};
  if(n==-3)return{k:"branco",t:"Tríduo Pascal"};
  if(n==-2)return{k:"vermelho",t:"Tríduo Pascal"};
  if(n==-1)return{k:"roxo",t:"Tríduo Pascal"};
  if(n>=0&&n<49)return{k:"branco",t:"Tempo Pascal"};
  if(n==49)return{k:"vermelho",t:"Pentecostes"};
  return{k:"verde",t:"Tempo Comum"};
}
const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return h};
/* ===== CALENDÁRIO LITÚRGICO ===== */
const LEG=[["verde","Tempo Comum"],["roxo","Advento e Quaresma"],["branco","Natal, Páscoa, festas do Senhor, de Nossa Senhora e dos santos"],["vermelho","Domingo de Ramos, Sexta-feira Santa, Pentecostes, apóstolos e mártires"],["rosa","3º domingo do Advento e 4º da Quaresma"]];
let calM=null;
const dayColor=d=>{const c=ls.get("lit_"+iso(d),null),k=c&&colorKey(c.color);return k||seasonOf(d).k};
function renderCal(){
  const y=calM.getFullYear(),m=calM.getMonth(),n=new Date(y,m+1,0).getDate(),pad=new Date(y,m,1).getDay(),td=iso(new Date()),sl=iso(cur);
  let cells="";for(let i=0;i<pad;i++)cells+="<span></span>";
  for(let d=1;d<=n;d++){const D=new Date(y,m,d,12),k=dayColor(D),id=iso(D);cells+=`<button class="cd${id==sl?" sel":""}${id==td?" td":""}" data-d="${d}" aria-label="${d}, ${NOMES[k]}">${d}<i style="background:${LIT[k][0]}"></i></button>`}
  $("cals").innerHTML=`<div class="sh-h"><button class="ib" id="cp" aria-label="Mês anterior">‹</button><h3>${new Date(y,m,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</h3><button class="ib" id="cn" aria-label="Próximo mês">›</button><button class="ib" id="cx" aria-label="Fechar">✕</button></div>
    <div class="cg">${["D","S","T","Q","Q","S","S"].map(x=>`<div class="w">${x}</div>`).join("")}${cells}</div>
    <div class="lg">${LEG.map(x=>`<div><i style="background:${LIT[x[0]][0]}"></i><p style="margin:0"><b>${NOMES[x[0]]}</b><span>${x[1]}</span></p></div>`).join("")}</div>
    <p class="cnote">Toque em um dia para abrir a liturgia. As cores seguem o tempo litúrgico; festas e memórias podem mudar a cor de um dia, e dias já abertos mostram a cor informada pela fonte.</p>`;
  $("cp").onclick=()=>{calM=new Date(y,m-1,1,12);renderCal()};$("cn").onclick=()=>{calM=new Date(y,m+1,1,12);renderCal()};$("cx").onclick=()=>{$("calm").hidden=true};
  $("cals").querySelectorAll(".cd").forEach(b=>b.onclick=()=>{cur=new Date(y,m,+b.dataset.d,12);$("calm").hidden=true;play("tap");scrollTo(0,0);load()});
}
function openCal(){calM=new Date(cur.getFullYear(),cur.getMonth(),1,12);renderCal();$("calm").hidden=false;play("tap")}
$("calopen").onclick=openCal;
$("calm").onclick=e=>{if(e.target==$("calm"))$("calm").hidden=true};
/* ===== AJUSTES: tema, cor e som ===== */
/* PWA: manifesto montado aqui, com os ícones embutidos (não depende de pastas) */
(function(){try{

const mq=matchMedia("(prefers-color-scheme:dark)");
function applyTheme(){
  const R=document.documentElement,dark=ST.mode=="dark"||(ST.mode=="auto"&&mq.matches);
  R.dataset.cor=ST.cor;dark?R.setAttribute("data-dark",""):R.removeAttribute("data-dark");
  document.querySelectorAll(".logo").forEach(i=>i.src=((dark&&!i.classList.contains("app")?ICONS_D:ICONS)[ST.cor])||ICONS.terra);const fv=document.querySelector('link[rel=icon]');if(fv)fv.href=ICONS[ST.cor]||ICONS.terra;
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=getComputedStyle(R).getPropertyValue("--bg").trim()||BRAND[ST.cor];
}
mq.addEventListener&&mq.addEventListener("change",applyTheme);
let ac=null;
function tone(f,d,g,w){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state=="suspended")ac.resume();
    const t=ac.currentTime+(w||0),o=ac.createOscillator(),n=ac.createGain();
    o.frequency.value=f;n.gain.setValueAtTime(0,t);n.gain.linearRampToValueAtTime(g*ST.vol,t+.01);n.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(n);n.connect(ac.destination);o.start(t);o.stop(t+d+.05)}catch(e){}
}
function play(k){if(!ST.snd)return;if(k=="tap")tone(660,.09,.14);else if(k=="ok"){tone(523.25,.25,.14);tone(783.99,.4,.14,.1)}}
const saveST=()=>{ls.set("st",ST);applyTheme()};

}

const LABELS={primeiraLeitura:"1ª Leitura",salmo:"Salmo",segundaLeitura:"2ª Leitura",evangelho:"Evangelho"};
let cur=new Date();cur.setHours(12,0,0,0);
let data=null,sel=0,fs=ls.get("fs",19);

function normalize(j){
  const L=j.leituras||{},out=[];
  const add=(k,label,v)=>{
    if(!v)return;if(!Array.isArray(v))v=[v];
    v=v.filter(x=>x&&x.texto);
    v.forEach((x,i)=>out.push({k,label:v.length>1?`${label} (${i+1})`:label,ref:x.referencia||x.titulo||"",refrao:x.refrao||"",text:String(x.texto).trim()}));
  };
  for(const k of Object.keys(LABELS))add(k,LABELS[k],L[k]);
  (Array.isArray(L.extras)?L.extras:[]).forEach(x=>add("extra",x.tipo||x.titulo||"Leitura extra",x));
  return{title:j.liturgia||"Liturgia do dia",color:String(j.cor||"").toLowerCase(),readings:out};
}
async function getJson(u,ms){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw"HTTP "+r.status;return await r.json()}catch(e){throw typeof e=="string"?e:e&&e.name=="AbortError"?"tempo esgotado":e instanceof TypeError?"sem resposta (rede ou bloqueio CORS)":"resposta inválida"}finally{clearTimeout(t)}
}
/* busca o dia na fonte; tenta de novo (o servidor gratuito pode demorar a acordar) e usa o endereço alternativo */
async function getDay(d){
  const key="lit_"+iso(d),hit=ls.get(key,null);
  if(hit&&hit.readings&&hit.readings.length)return hit;
  const f=u=>u.replace("{d}",d.getDate()).replace("{m}",d.getMonth()+1).replace("{y}",d.getFullYear());
  const urls=[f(CONFIG.liturgiaUrl)];
  if(CONFIG.liturgiaUrlAlt&&d.getFullYear()==new Date().getFullYear())urls.push(f(CONFIG.liturgiaUrlAlt));
  for(const [u,ms] of [[urls[0],12000],[urls[1]||urls[0],25000],[urls[0],25000]]){
    try{const v=normalize(await getJson(u,ms));if(v.readings.length){ls.set(key,v);return v}lastErr="a fonte respondeu sem leituras"}catch(e){lastErr=e}
  }
  return null;
}
let reqId=0,lastErr="";
async function load(){
  const my=++reqId,d=new Date(cur);
  $("dt").textContent=cur.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  $("ti").textContent="Carregando…";$("rd").innerHTML="";$("chips").innerHTML="";sel=0;
  data=null;paintColor(d);
  const v=await getDay(d);
  if(my!==reqId)return;
  data=v;render();renderDev();
  prefetch(d,my);
}
/* deixa os próximos dias salvos no aparelho */
async function prefetch(d,my){
  for(let i=1;i<=3;i++){const n=new Date(d);n.setDate(n.getDate()+i);if(my!==reqId)return;await getDay(n)}
}
/* pinta a aba Liturgia com a cor litúrgica (da fonte ou, se faltar, do calendário local) */
function paintColor(d){
  const fb=seasonOf(d),k=(data&&colorKey(data.color))||fb.k,el=$("leit");
  el.dataset.lit=k;el.style.setProperty("--lit",LIT[k][0]);el.style.setProperty("--lit-d",LIT[k][1]);
  const ctx=data&&colorKey(data.color)?"Cor litúrgica":"Cor do "+fb.t;
  $("cor").innerHTML=`<i></i><span><small>${esc(ctx)}</small><b>${NOMES[k]}</b></span>`;
}
function render(){
  document.documentElement.style.setProperty("--fs",fs+"px");
  
  $("ti").textContent=data?data.title:"Leituras indisponíveis";
  paintColor(cur);
  if(!data){
    $("rd").innerHTML=`<div class="note">Não foi possível carregar as leituras deste dia. Verifique a conexão e tente novamente (o servidor gratuito às vezes demora para responder).<br><small>Motivo: ${esc(lastErr||"desconhecido")}</small></div><button class="btn" onclick="load()">Tentar novamente</button>`;
    $("src").textContent="";return;
  }
  $("chips").innerHTML=data.readings.map((r,i)=>`<button class="chip" data-i="${i}" aria-pressed="${i==sel}">${esc(r.label)}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{sel=+b.dataset.i;play("tap");render()});
  const r=data.readings[sel];
  $("rd").innerHTML=`<article class="card"><div class="top"><b>${esc(r.label)}</b><button class="fs" id="fm">A−</button><button class="fs" id="fp">A+</button></div>
    <p class="ref">${esc(r.ref)}</p>${r.refrao?`<p class="rf">${esc(r.refrao)}</p>`:""}<div class="txt">${esc(r.text)}</div></article>`;
  $("fm").onclick=()=>{fs=Math.max(15,fs-2);ls.set("fs",fs);render()};
  $("fp").onclick=()=>{fs=Math.min(30,fs+2);ls.set("fs",fs);render()};
  $("src").textContent="Texto fornecido pela fonte configurada.";
}

/* ===== CONTA ===== */
const SB=CONFIG.supabase,remote=!!(SB.url&&SB.anonKey);
let sess=ls.get("auth",null),mode="in";
const mail=n=>n.toLowerCase()+"@example.com";
async function authReq(path,body){
  const r=await fetch(SB.url+"/auth/v1/"+path,{method:"POST",headers:{apikey:SB.anonKey,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw j;return j;
}
function saveSess(j,nick){sess={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in-60)*1000,nick:nick||sess&&sess.nick};ls.set("auth",sess)}
async function token(){
  if(!sess)return null;
  if(Date.now()>sess.exp){try{saveSess(await authReq("token?grant_type=refresh_token",{refresh_token:sess.refresh}))}catch(e){sess=null;ls.set("auth",null);renderGate();return null}}
  return sess.access;
}
async function doAuth(n,p){
  if(!/^[A-Za-z0-9_]{3,20}$/.test(n))throw"Apelido: 3 a 20 letras, números ou _.";
  if(p.length<6)throw"A senha precisa ter ao menos 6 caracteres.";
  try{
    if(mode=="up"){const j=await authReq("signup",{email:mail(n),password:p,data:{nickname:n}});if(!j.access_token)throw 0;saveSess(j,n)}
    else{const j=await authReq("token?grant_type=password",{email:mail(n),password:p});saveSess(j,(j.user&&j.user.user_metadata&&j.user.user_metadata.nickname)||n)}
  }catch(e){throw mode=="up"?"Apelido indisponível ou dados inválidos.":"Apelido ou senha incorretos."}
}
function logout(){couple=null;sess=null;ls.set("auth",null);renderDev();renderRank();renderGate()}
function renderGate(){
  const g=$("gate");g.hidden=!(remote&&!sess);if(g.hidden)return;
  $("gate-form").innerHTML=`<div class="seg"><button data-m="in" aria-pressed="${mode=="in"}">Entrar</button><button data-m="up" aria-pressed="${mode=="up"}">Criar conta</button></div>
    <input id="au" maxlength="20" placeholder="Apelido" autocapitalize="none" autocomplete="username"><input id="ap" type="password" placeholder="Senha" autocomplete="${mode=="in"?"current-password":"new-password"}">
    <div class="st" id="as" style="min-height:20px;margin:2px 0 10px"></div><button class="btn" id="ago">${mode=="in"?"Entrar":"Criar conta"}</button>`;
  $("gate-form").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;renderGate()});
  const go=async()=>{
    $("ago").disabled=true;
    try{await doAuth($("au").value.trim(),$("ap").value);play("ok");showSplash();renderGate();loadCouple();renderDev();renderRank()}
    catch(e){$("as").textContent=typeof e=="string"?e:"Não foi possível continuar.";$("ago").disabled=false}
  };
  $("ago").onclick=go;
  $("ap").onkeydown=e=>{if(e.key=="Enter")go()};
}

/* ===== CASAL ===== */
let couple=null;
const rpc=async(fn,body)=>{const r=await fetch(`${SB.url}/rest/v1/rpc/${fn}`,{method:"POST",headers:await H(),body:JSON.stringify(body||{})});const j=await r.json().catch(()=>({}));if(!r.ok)throw j;return j};
const paired=()=>!!(couple&&couple.estado=="conectado");
async function loadCouple(){
  if(!remote||!sess){couple=null;return}
  try{couple=await rpc("couple_status")}catch(e){couple=null}
  renderCouple();if(!$("dev").hidden)renderDev();
}
function renderCouple(){
  const b=$("cplbox");if(!b)return;
  if(!remote){b.innerHTML=`<p>Disponível quando o servidor estiver configurado.</p>`;return}
  if(!sess){b.innerHTML=`<p>Entre na sua conta para conectar seu par.</p>`;return}
  if(!couple){b.innerHTML=`<p>Não foi possível carregar. <button class="fs" id="cretry">Tentar de novo</button></p>`;$("cretry").onclick=loadCouple;return}
  if(couple.estado=="conectado"){
    b.innerHTML=`<p>Vocês estão conectados: <b style="color:var(--ink)">${esc(sess.nick)}</b> e <b style="color:var(--ink)">${esc(couple.parceiro||"parceiro(a)")}</b>. As reflexões marcadas como "só o casal" aparecem para os dois.</p><button class="btn alt" id="cleave">Desconectar</button>`;
    $("cleave").onclick=async()=>{if(!confirm("Desconectar do seu par? As reflexões do casal deixam de ser compartilhadas."))return;try{await rpc("couple_leave");couple={estado:"nenhum"}}catch(e){}renderCouple();renderDev()};
  }else if(couple.estado=="aguardando"){
    b.innerHTML=`<p>Peça ao seu par para abrir <b style="color:var(--ink)">Ajustes › Casal</b> e digitar este código:</p><div class="code">${esc(couple.codigo)}</div><div class="row"><button class="btn alt" id="ccopy">Copiar</button><button class="btn alt" id="ccancel">Cancelar convite</button></div><div class="st" id="cst" style="margin-top:8px"></div>`;
    $("ccopy").onclick=async()=>{try{await navigator.clipboard.writeText(couple.codigo);$("cst").textContent="Código copiado."}catch(e){$("cst").textContent="Anote o código acima."}};
    $("ccancel").onclick=async()=>{try{await rpc("couple_leave");couple={estado:"nenhum"}}catch(e){}renderCouple()};
  }else{
    b.innerHTML=`<p>Conecte-se com seu par para compartilhar reflexões só entre vocês dois.</p><button class="btn" id="cnew" style="width:100%">Gerar código de convite</button>
      <p style="margin:16px 0 8px">Já recebeu um código?</p><div class="row"><input id="ccode" maxlength="6" placeholder="Código" autocapitalize="characters" autocomplete="off"><button class="btn" id="cjoin">Conectar</button></div><div class="st" id="cst" style="margin-top:8px"></div>`;
    $("cnew").onclick=async()=>{$("cnew").disabled=true;try{couple=await rpc("couple_invite");play("ok")}catch(e){$("cst").textContent="Não foi possível gerar o código."}renderCouple()};
    $("cjoin").onclick=async()=>{
      const c=$("ccode").value.trim();if(c.length<4){$("cst").textContent="Digite o código completo.";return}
      $("cjoin").disabled=true;
      try{couple=await rpc("couple_join",{p_code:c});play("ok");renderCouple();renderDev();return}
      catch(e){$("cst").textContent=/ja_conectado/.test(e&&e.message||"")?"Você já está conectado(a).":"Código inválido ou já usado."}
      $("cjoin").disabled=false;
    };
  }
}

/* ===== DEVOCIONAL ===== */
const H=async()=>{const t=await token(),h={apikey:SB.anonKey,"Content-Type":"application/json"};if(t)h.Authorization="Bearer "+t;return h}; /* chave nova (sb_publishable_) não é JWT: só vai no apikey */
async function listC(){
  if(!remote)return ls.get("cm_"+iso(cur),[]);
  const r=await fetch(`${SB.url}/rest/v1/comments?day=eq.${iso(cur)}&order=created_at.desc&limit=100`,{headers:await H()});
  if(!r.ok)throw 0;return r.json();
}
async function postC(c){
  if(!remote){const a=ls.get("cm_"+iso(cur),[]);a.unshift({...c,created_at:new Date().toISOString()});ls.set("cm_"+iso(cur),a);return}
  const r=await fetch(`${SB.url}/rest/v1/comments`,{method:"POST",headers:{...await H(),Prefer:"return=minimal"},body:JSON.stringify({day:iso(cur),body:c.body,visibility:c.visibility||"publico"})});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw (j.message||j.hint||("HTTP "+r.status))}
}
let vis="casal";
function renderDev(){
  const ev=data&&data.readings.find(r=>r.k=="evangelho");
  let top="";
  if(!remote)top=`<div class="note">Os comentários compartilhados ainda não estão ativados. Por enquanto, o que você escrever fica só neste aparelho.</div>`;
  const canPost=!remote||sess;
  $("dev").innerHTML=`<h2 class="sec">Devocional</h2><p class="sub">Compartilhe o que a liturgia de hoje disse a você.</p>
    ${ev?`<div class="note"><b>Evangelho:</b> ${esc(ev.ref)}</div>`:""}${top}
    ${canPost?`<div class="form">${remote?`<div class="who">Publicando como <b>${esc(sess.nick)}</b><button id="out">Sair</button></div>`:`<input id="nm" maxlength="40" placeholder="Seu nome" value="${esc(ls.get("nome",""))}">`}${remote&&paired()?`<div class="seg vis"><button data-vis="casal" aria-pressed="${vis=="casal"}">🔒 Só o casal</button><button data-vis="publico" aria-pressed="${vis=="publico"}">Todos</button></div>`:remote&&sess?`<div class="note" style="margin:8px 0 0">Quer compartilhar só com seu par? Conecte-se em <b>Ajustes › Casal</b>.</div>`:""}<textarea id="bd" maxlength="1000" placeholder="Escreva sua reflexão"></textarea>
    <div class="fr"><span class="st" id="st"></span><button class="btn" id="send">Publicar</button></div></div>`:""}<div id="lst"></div>`;
  $("dev").querySelectorAll("[data-vis]").forEach(b=>b.onclick=()=>{const t=$("bd").value;vis=b.dataset.vis;renderDev();$("bd").value=t});
  if($("out"))$("out").onclick=logout;
  if($("send"))$("send").onclick=async()=>{
    const body=$("bd").value.trim(),name=remote?"":$("nm").value.trim();
    if(!body||(!remote&&!name)){$("st").textContent="Escreva sua reflexão.";return}
    if(Date.now()-ls.get("last",0)<15000){$("st").textContent="Aguarde alguns segundos.";return}
    if(!remote)ls.set("nome",name);$("send").disabled=true;
    try{await postC({name,body,visibility:remote&&paired()?vis:"publico"});ls.set("last",Date.now());$("bd").value="";$("st").textContent="Publicado.";play("ok")}
    catch(e){$("st").textContent="Não foi possível publicar"+(typeof e=="string"?": "+e:".")}
    $("send").disabled=false;fill();renderRank();
  };
  fill();
}
async function fill(){
  const box=$("lst");if(!box)return;
  try{
    const a=await listC();
    box.innerHTML=a.length?a.map(c=>{const n=c.nickname||c.name||"?";return`<div class="cm"><div class="av" style="background:hsl(${hue(n)} 45% 45%)">${esc(n.trim().charAt(0).toUpperCase())}</div><div><div class="w">${esc(n)}${c.visibility=="casal"?`<i class="tag">🔒 casal</i>`:""}<span>${new Date(c.created_at).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</span></div><p>${esc(c.body)}</p></div></div>`}).join(""):`<div class="empty">Nenhuma reflexão ainda. Seja o primeiro.</div>`;
  }catch(e){box.innerHTML=`<div class="empty">Não foi possível carregar as reflexões.</div>`}
}

/* ===== RANKING: dias com ao menos uma reflexão publicada ===== */
async function renderRank(){
  const el=$("rank");
  const head=`<h2 class="sec">Ranking</h2><p class="sub">Quem mais participa do devocional, por dias com reflexão publicada.</p>`;
  if(!remote){el.innerHTML=head+`<div class="note">O ranking fica disponível quando os comentários compartilhados estiverem ativados.</div>`;return}
  try{
    const r=await fetch(`${SB.url}/rest/v1/ranking?limit=50`,{headers:await H()});if(!r.ok)throw 0;
    const a=await r.json();
    el.innerHTML=head+(a.length?a.map((x,i)=>`<div class="rk${i<3?" top"+(i+1):""}${sess&&sess.nick&&x.nickname.toLowerCase()==sess.nick.toLowerCase()?" me":""}"><div class="pos">${i+1}</div><div class="av" style="background:hsl(${hue(x.nickname)} 45% 45%)">${esc(x.nickname.charAt(0).toUpperCase())}</div><div class="n">${esc(x.nickname)}</div><div class="s"><b>${x.dias}</b>${x.dias==1?"dia":"dias"} · ${x.reflexoes} ${x.reflexoes==1?"reflexão":"reflexões"}</div></div>`).join(""):`<div class="empty">Ainda não há participantes.</div>`);
  }catch(e){el.innerHTML=head+`<div class="empty">Não foi possível carregar o ranking.</div>`}
}

document.querySelectorAll(".tabbar button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabbar button").forEach(x=>x.setAttribute("aria-selected",x==b));
  const t=b.dataset.t;
  $("leit").hidden=t!="leit";$("dev").hidden=t!="dev";$("rank").hidden=t!="rank";$("set").hidden=t!="set";
  $("bt").textContent={leit:"Liturgia",dev:"Devocional",rank:"Ranking",set:"Ajustes"}[t];
  if(t=="rank")renderRank();if(t=="set"){renderSet();loadCouple()}if(t=="dev")loadCouple();play("tap");
  scrollTo(0,0);
});
const shift=n=>{play("tap");cur.setDate(cur.getDate()+n);load()};
$("prev").onclick=()=>shift(-1);$("next").onclick=()=>shift(1);
$("today").onclick=()=>{play("tap");cur=new Date();cur.setHours(12,0,0,0);load()};
showSplash();renderGate();load();renderRank();loadCouple();
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
